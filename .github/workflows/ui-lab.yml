name: ui-lab
on:
  workflow_dispatch:
  push:
    branches: [ui-lab/ios26-comparison]
    paths: ['ui-lab-payload.b64', '.github/workflows/ui-lab.yml']

permissions:
  contents: write

jobs:
  build-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payload
        shell: pwsh
        run: |
          $b64 = [IO.File]::ReadAllText("ui-lab-payload.b64") -replace '\s',''
          [IO.File]::WriteAllBytes("ui-lab.tar.gz", [Convert]::FromBase64String($b64))
          tar -xzf ui-lab.tar.gz
      - name: Commit lab sources for review
        shell: pwsh
        run: |
          git config user.name "instinct-bot"
          git config user.email "instinct@users.noreply.github.com"
          git add ui-lab
          git diff --cached --quiet || git commit -m "ui-lab: decoded lab sources"
          git push || echo "push failed (permissions), sources remain in artifact"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ui-lab/slint-demo -> target
            ui-lab/tauri-demo/src-tauri -> target
      - name: Build Slint demo
        run: cargo build --release --manifest-path ui-lab/slint-demo/Cargo.toml
      - name: Build Tauri demo
        run: cargo build --release --manifest-path ui-lab/tauri-demo/src-tauri/Cargo.toml
      - name: Run and capture
        shell: pwsh
        run: ui-lab/capture.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ui-lab-results
          path: ui-lab-results/
      - name: Commit key results for review
        shell: pwsh
        run: |
          git config user.name "instinct-bot"
          git config user.email "instinct@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path ui-lab-results-key | Out-Null
          foreach ($app in @('slint','tauri')) {
            $d = "ui-lab-results/$app"
            Copy-Item "$d/metrics.json" "ui-lab-results-key/$app-metrics.json" -ErrorAction SilentlyContinue
            Copy-Item "$d/app-metrics.json" "ui-lab-results-key/$app-app-metrics.json" -ErrorAction SilentlyContinue
            $frames = Get-ChildItem "$d/frame_*.png" -ErrorAction SilentlyContinue | Sort-Object Name
            if ($frames -and $frames.Count -gt 0) {
              $idx = @(0, [int]($frames.Count*0.25), [int]($frames.Count*0.5), [int]($frames.Count*0.75), $frames.Count-1)
              $n = 0
              foreach ($i in $idx) { Copy-Item $frames[$i].FullName ("ui-lab-results-key/{0}_key{1}.png" -f $app, $n); $n++ }
            }
          }
          git add ui-lab-results-key
          git diff --cached --quiet || git commit -m "ui-lab: key frames + metrics"
          git push || echo "push failed (permissions)"
