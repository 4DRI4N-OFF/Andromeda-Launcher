name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --all -- --check > fmt.diff 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' fmt.diff > fmt.plain
          echo "::notice::fmt lines=$(wc -l < fmt.plain) diffheaders=$(grep -ac 'Diff in' fmt.plain)"
          payload=$(sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' fmt.plain)
          echo "::error::FMT-DIFF-BEGIN ${payload}"
          cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy.out 2>&1
          code=$?
          set -e
          sed 's/\x1b\[[0-9;]*m//g' clippy.out > clippy.plain
          grep -a -E '^(error|warning)(\[|:)|^ *--> |^thread ' -A 2 clippy.plain | head -n 300 > snippet.txt || true
          echo "::notice::clippy exit=$code total=$(wc -l < clippy.out) snippet=$(wc -l < snippet.txt)"
          while IFS= read -r line; do echo "::error::$line"; done < snippet.txt || true
          exit $code
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Build core (release cfg)
        run: cargo build -p andromeda-core --release --locked

  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (core)
        run: cargo clippy -p andromeda-core --all-targets --locked -- -D warnings
      - name: Tests (core)
        run: cargo test -p andromeda-core --locked
      - name: Build core (release cfg)
        run: cargo build -p andromeda-core --release --locked
