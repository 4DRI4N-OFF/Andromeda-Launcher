# REVIEW-ONLY workflow draft v3. Lives only on review/home-ui-c9ebfd4, never merged.
# Visual + renderer evidence for the isolated Home/header rework on real Windows.
# No real accounts, no user data, no PC access: the exe runs with throwaway
# HOME/APPDATA on the runner and is killed after capture.
# v3 fixes: artifacts previously uploaded ZERO files because the upload step used
# ${{ env.RUNNER_TEMP }}, which is NOT defined in the GitHub `env` expression
# context (RUNNER_TEMP only exists as $env:RUNNER_TEMP inside pwsh), so the path
# resolved to literal /caps and /logs. Outputs now live under the workspace in
# review-out/ and upload uses a plain relative path, if: always(), and
# if-no-files-found: error so a missing artifact fails the job.
# Caveats: a requested SLINT_BACKEND is NOT proof of the effective renderer;
# the probe step collects logs/GPU info as evidence. CopyFromScreen may yield a
# black frame in a non-interactive session; captures are validated below and a
# black/empty frame fails the job instead of being called evidence.
name: Home review (visual)
on:
  workflow_dispatch:
  # TEMPORARY push trigger, only so the workflow can run before existing on the
  # default branch. MUST be removed before any integration of this branch.
  push:
    branches:
      - review/home-ui-c9ebfd4
permissions:
  contents: read
jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p andromeda-app --locked
      - name: Capture default / femtovg / software at 100% and 125%
        shell: pwsh
        run: |
          $cap = "review-out/caps"; New-Item -ItemType Directory -Force $cap | Out-Null
          $logs = "review-out/logs"; New-Item -ItemType Directory -Force $logs | Out-Null
          Add-Type -AssemblyName System.Drawing
          foreach ($backend in @('default', 'winit-femtovg', 'winit-software')) {
            foreach ($scale in @('1.0', '1.25')) {
              # Explicit env reset per run: no inheritance between iterations.
              Remove-Item Env:SLINT_BACKEND -ErrorAction SilentlyContinue
              Remove-Item Env:SLINT_SCALE_FACTOR -ErrorAction SilentlyContinue
              if ($backend -ne 'default') { $env:SLINT_BACKEND = $backend }
              $env:SLINT_SCALE_FACTOR = $scale
              $env:HOME = "$env:RUNNER_TEMP/fakehome"; $env:APPDATA = "$env:RUNNER_TEMP/fakeappdata"
              $tag = "$backend-$($scale -replace '\.','')"
              $p = Start-Process -FilePath "target/release/andromeda.exe" -PassThru `
                   -RedirectStandardOutput "$logs/out-$tag.log" -RedirectStandardError "$logs/err-$tag.log"
              Start-Sleep -Seconds 6
              # Early-exit check BEFORE any kill: a process that died on its own is the only crash signal.
              if ($p.HasExited) { Write-Error "andromeda.exe exited on its own (code $($p.ExitCode)) backend=$backend scale=$scale"; exit 1 }
              # Real-window check: no main window handle/title means nothing was rendered to capture.
              $p.Refresh()
              if (-not $p.MainWindowHandle -or $p.MainWindowHandle -eq 0 -or [string]::IsNullOrWhiteSpace($p.MainWindowTitle)) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                Write-Error "no real window detected for backend=$backend scale=$scale; capture would be an empty desktop"; exit 1
              }
              $title = $p.MainWindowTitle
              $b = New-Object System.Drawing.Bitmap 1920, 1080
              $g = [System.Drawing.Graphics]::FromImage($b)
              $g.CopyFromScreen(0, 0, 0, 0, $b.Size)
              $b.Save("$cap/home-$tag.png")
              # Black-frame check: sample pixels; a uniform near-black frame is not evidence.
              $samples = 0; $lit = 0
              foreach ($x in 100, 640, 1280, 1800) { foreach ($y in 100, 400, 700, 1000) {
                $samples++; $px = $b.GetPixel($x, $y); if (($px.R + $px.G + $px.B) -gt 45) { $lit++ }
              } }
              $g.Dispose(); $b.Dispose()
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              if ($lit -eq 0) { Write-Error "capture home-$tag.png is uniformly dark (session likely non-interactive); not valid evidence"; exit 1 }
              Write-Host "capture $tag ok ($lit/$samples lit samples, window '$title')"
            }
          }
      - name: Probe effective renderer evidence (default env, fresh process)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "review-out/logs" | Out-Null
          # Fresh env: explicitly NO SLINT_BACKEND/SLINT_SCALE_FACTOR inherited from the loop.
          Remove-Item Env:SLINT_BACKEND -ErrorAction SilentlyContinue
          Remove-Item Env:SLINT_SCALE_FACTOR -ErrorAction SilentlyContinue
          $env:RUST_LOG = "info"; $env:SLINT_LOGGING = "info"
          $env:HOME = "$env:RUNNER_TEMP/fakehome"; $env:APPDATA = "$env:RUNNER_TEMP/fakeappdata"
          $p = Start-Process -FilePath "target/release/andromeda.exe" -PassThru `
               -RedirectStandardOutput "review-out/logs/out-probe.log" -RedirectStandardError "review-out/logs/err-probe.log"
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Host "probe exited on its own, code $($p.ExitCode)" } else { Stop-Process -Id $p.Id -Force }
          # GPU/driver context for the renderer discussion; full logs are uploaded as artifacts.
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table -AutoSize | Out-String | Out-File "review-out/logs/gpu.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-review-captures
          path: review-out
          if-no-files-found: error
          retention-days: 7
