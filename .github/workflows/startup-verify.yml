# Consolidated verification for the startup first-frame repair.
# One run does the full backend gate (fmt, clippy, tests, debug+release builds,
# smoke) AND the visual proof that the app reaches real Home on Windows
# (.github/scripts/startup-verify.ps1): it waits for the main window titled
# "Andromeda Launcher" (never a fixed sleep), fails on splash/modal-only
# states, preserves data/logs per run, and the artifact upload errors out if
# evidence is missing. The exe artifact of this same code is the pre-release
# binary candidate.
# No real accounts, no user data: the exe runs with throwaway HOME/APPDATA on
# the runner and is killed after capture.
name: Startup verify (consolidated)
on:
  workflow_dispatch:
  push:
    branches: [review/steam-library-validation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    # ci.yml needed 60 min for build alone at 45m02s; +visual ~5m. 75 leaves headroom.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed library overlay with immutable provenance
        shell: pwsh
        run: |
          $expectedBase = '0170d24e8c596ecc50fe0bdf96b2fb1cb650c35a'
          # Validation commits contain only an archive and this workflow.
          git merge-base --is-ancestor $expectedBase HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Expected source base is not an ancestor' }
          $archive = @(Get-ChildItem -File '*Andromeda-Steam-Library-0170d24-review.tar-77085ddf.gz')
          if ($archive.Count -ne 1) { throw 'Expected exactly one reviewed archive' }
          $digest = (Get-FileHash $archive[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '5aa67a04ac6a073051b40719681fb9c281da963f1519c382f7c4517028c76ff9') { throw 'Reviewed archive hash mismatch' }
          $out = Join-Path $env:RUNNER_TEMP 'reviewed-library'
          New-Item -ItemType Directory -Force $out | Out-Null
          tar -xzf $archive[0].FullName -C $out
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          $review = Join-Path $out 'andromeda-steam-native-review'
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.base -ne $expectedBase) { throw 'Manifest base mismatch' }
          git diff --exit-code $expectedBase -- app core Cargo.lock Cargo.toml scripts
          if ($LASTEXITCODE -ne 0) { throw 'Validation branch application differs from expected base' }
          $changes = @($manifest.modified) + @($manifest.added)
          if ($changes.Count -ne 17 -or @($manifest.deleted).Count -ne 0) { throw 'Unexpected overlay scope' }
          foreach ($line in Get-Content (Join-Path $review 'SHA256SUMS')) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'Invalid checksum line' }
            $want = $Matches[1]; $path = $Matches[2]
            if ($path -notmatch '^overlay/app/' -or $path.Contains('..')) { throw 'Unexpected checksum path' }
            $actual = (Get-FileHash (Join-Path $review $path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $want) { throw 'Overlay file checksum mismatch' }
          }
          Copy-Item (Join-Path $review 'overlay/*') . -Recurse -Force
          New-Item -ItemType Directory -Force 'verify-out/logs' | Out-Null
          Copy-Item (Join-Path $review 'manifest.json') 'verify-out/logs/review-manifest.json'
          Copy-Item (Join-Path $review 'SHA256SUMS') 'verify-out/logs/review-SHA256SUMS.txt'
          "base=$expectedBase; archive_sha256=$digest; validation_commit=$env:GITHUB_SHA" | Out-File 'verify-out/logs/source-provenance.txt'
          git status --short | Out-File 'verify-out/logs/source-status.txt'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo build --release -p andromeda-app --locked
      - name: Smoke-run the packaged exe (non-interactive session)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target/release/andromeda.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "andromeda.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "andromeda.exe stayed alive 15s without an early crash"
      - name: Preserve smoke-run logs and reset data dir (attribution)
        if: always()
        shell: pwsh
        run: |
          # The smoke run above also writes $GITHUB_WORKSPACE/data/logs (data_dir
          # is compile-time: CARGO_MANIFEST_DIR.parent()/data). Preserve those
          # logs as the smoke run's own evidence, then remove the directory so
          # the visual run's logs below are unambiguously its own.
          New-Item -ItemType Directory -Force "verify-out/logs/smoke" | Out-Null
          if (Test-Path "data/logs") {
            Copy-Item "data/logs/*" "verify-out/logs/smoke/" -Recurse -Force
            Remove-Item "data" -Recurse -Force
            Write-Host "smoke logs preserved and data/ reset for clean visual attribution"
          } else {
            Write-Host "smoke run produced no data/logs (process died early or never reached load())"
          }
      - name: Visual verify - wait for real Home, not fixed seconds
        shell: pwsh
        run: ./.github/scripts/startup-verify.ps1
      - name: Probe GPU/driver context
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "verify-out/logs" | Out-Null
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table -AutoSize | Out-String | Out-File "verify-out/logs/gpu.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-verify-out
          path: verify-out
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        # Preserve the built candidate even when a later diagnostic fails.
        # The failed job stays failed; an artifact is not approval to publish.
        if: always()
        with:
          name: andromeda-windows-x86_64
          path: target/release/andromeda.exe
          if-no-files-found: error
          retention-days: 14
