# Consolidated verification for the startup first-frame repair.
# One run does the full backend gate (fmt, clippy, tests, debug+release builds,
# smoke) AND the visual proof that the app reaches real Home on Windows
# (.github/scripts/startup-verify.ps1): it waits for the main window titled
# "Andromeda Launcher" (never a fixed sleep), fails on splash/modal-only
# states, preserves data/logs per run, and the artifact upload errors out if
# evidence is missing. The exe artifact of this same code is the pre-release
# binary candidate.
# No real accounts, no user data: the exe runs with throwaway HOME/APPDATA on
# the runner and is killed after capture.
name: Startup verify (consolidated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    # ci.yml needed 60 min for build alone at 45m02s; +visual ~5m. 75 leaves headroom.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify reviewed R2 source
        shell: pwsh
        run: |
          $expectedBase = '0170d24e8c596ecc50fe0bdf96b2fb1cb650c35a'
          git diff --exit-code $expectedBase -- app core Cargo.lock Cargo.toml scripts
          if ($LASTEXITCODE -ne 0) { throw 'Application tree is not the exact reviewed base' }
          $encoded = [IO.File]::ReadAllText((Join-Path $PWD 'library-r2-payload.txt')).Trim()
          $packed = [Convert]::FromBase64String($encoded)
          $stream = [IO.MemoryStream]::new($packed)
          $gzip = [IO.Compression.GZipStream]::new($stream,[IO.Compression.CompressionMode]::Decompress)
          $reader = [IO.StreamReader]::new($gzip)
          $files = $reader.ReadToEnd() | ConvertFrom-Json -AsHashtable
          $reader.Dispose()
          if ($files.Count -ne 17) { throw 'Expected 17 text files' }
          foreach ($path in $files.Keys) {
            if ($path -notmatch '^app/' -or $path.Contains('..') -or $path.Contains('cover.png')) { throw 'Unexpected file path' }
            $dest = Join-Path $PWD $path
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String($files[$path]))
          }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/rose-pine/wallpapers/main/minecraft/snow-mountain-range.jpg' -OutFile 'app/ui/steam/cover.jpg'
          $expected = @'
          {"app/src/main.rs":"d90bd1da0cfa018b0e53d067c279032b1a1ab0821a49609240435a442bd5e04b","app/ui/main.slint":"4ed03058cae218f64798832e0262bfedfc67d02aad77ad754126ed378e5d971e","app/ui/motion.slint":"44da37fafe6d43b844b23c6b299487b6805e07cba95c6766aa9912e004bf529d","app/ui/steam/ASSETS.md":"e22e23f4ab7b85a0c46ee96801752d0b688a4cb67629e59b140ec0a75d8d5594","app/ui/steam/coolicons/LICENSE":"35d8a4a8e1793b261198949d213583904b11e3826be8618ae9b9dbc6b70f50cc","app/ui/steam/coolicons/README.md":"df86de667decfebdffcc78e5b0185941740421c6b2b105b0cf1d594f7f24da36","app/ui/steam/coolicons/box.svg":"53d1b254baad78f05082f8cd934f5a949cc427fa4498a86535f1df0bbf77ce51","app/ui/steam/coolicons/play.svg":"5ad478b94a697dcff110d8ffb9d889c44d8ff8e267577e7cf4c35d4391700b97","app/ui/steam/coolicons/plus.svg":"7ca7bb5c343ad311084e6f69a877743f99fdda3acb6c35e9fed72adebc0d71ec","app/ui/steam/coolicons/puzzle.svg":"1673f61744a8f36cb86abb94113d3e9cafc8a1a3b2ca732f8efce7ad369397e3","app/ui/steam/coolicons/settings.svg":"5c8d6774e5cb17fef0aefef33cbc456b38261227beaf577ca8ed6545bf4e21ce","app/ui/steam/coolicons/user.svg":"eb4832bb68233f7cf39b7ea985e021b996a5f4764c65157e60c79b3ef5839fc2","app/ui/steam/library.slint":"2a5e0f2a3544e006b36076b7b5a69c69e1b95e000b3f1a9761f2e5d6453d53c5","app/ui/steam/planet.svg":"284181ffb265c52eab2d39c6a797bbefc4c22d2b47698e0205dac677748a6391","app/ui/steam/shell.slint":"15f8bdeb130b22542763c532ee024df0939d77c48d71d9a7ba3f729d901121de","app/ui/steam/wordmark.svg":"7ea86ff156e9094d72a60355cc90226433dc3b19a7fa8133080b27a317f7c26d","app/ui/steam/cover.jpg":"f77f2b52253768c975e5ef79afe2a1f6798884004ae8ee0e8369ad0da43729fe","app/ui/steam/COVER-CC0-LICENSE.txt":"a2010f343487d3f7618affe54f789f5487602331c0a8d03f49e9a7c547cf0499"}
          '@ | ConvertFrom-Json -AsHashtable
          if ($expected.Count -ne 18) { throw 'Expected 18 reviewed file hashes' }
          foreach ($path in $expected.Keys) {
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$path]) { throw "Reviewed file hash mismatch: $path" }
          }
          New-Item -ItemType Directory -Force 'verify-out/logs' | Out-Null
          $expected | ConvertTo-Json | Out-File 'verify-out/logs/reviewed-r2-hashes.json'
          "base=$expectedBase; reviewed_archive_sha256=9cdc00194d0ee3f3db792553b7f8950d561d2226d56eeddd493cb0dec77f58cb; validation_commit=$env:GITHUB_SHA" | Out-File 'verify-out/logs/source-provenance.txt'
          git status --short | Out-File 'verify-out/logs/source-status.txt'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo build --release -p andromeda-app --locked
      - name: Smoke-run the packaged exe (non-interactive session)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target/release/andromeda.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "andromeda.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "andromeda.exe stayed alive 15s without an early crash"
      - name: Preserve smoke-run logs and reset data dir (attribution)
        if: always()
        shell: pwsh
        run: |
          # The smoke run above also writes $GITHUB_WORKSPACE/data/logs (data_dir
          # is compile-time: CARGO_MANIFEST_DIR.parent()/data). Preserve those
          # logs as the smoke run's own evidence, then remove the directory so
          # the visual run's logs below are unambiguously its own.
          New-Item -ItemType Directory -Force "verify-out/logs/smoke" | Out-Null
          if (Test-Path "data/logs") {
            Copy-Item "data/logs/*" "verify-out/logs/smoke/" -Recurse -Force
            Remove-Item "data" -Recurse -Force
            Write-Host "smoke logs preserved and data/ reset for clean visual attribution"
          } else {
            Write-Host "smoke run produced no data/logs (process died early or never reached load())"
          }
      - name: Visual verify - wait for real Home, not fixed seconds
        shell: pwsh
        run: ./.github/scripts/startup-verify.ps1
      - name: Probe GPU/driver context
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "verify-out/logs" | Out-Null
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table -AutoSize | Out-String | Out-File "verify-out/logs/gpu.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-verify-out
          path: verify-out
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        # Preserve the built candidate even when a later diagnostic fails.
        # The failed job stays failed; an artifact is not approval to publish.
        if: always()
        with:
          name: andromeda-windows-x86_64
          path: target/release/andromeda.exe
          if-no-files-found: error
          retention-days: 14
